[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kocer"
version = "0.5.0"
description = "한국어 STT용 CER: 글자가 아니라 읽기가 같은지로 채점. 띄어쓰기·문장부호·숫자 표기(3개 = 세 개)·영문 약어(AI = 에이아이) 차이는 오류로 세지 않음"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Choi Kwan-u" }]
keywords = ["korean", "stt", "asr", "cer", "wer", "evaluation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Natural Language :: Korean",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Choi-kwan-u/kocer"

[project.scripts]
kocer = "kocer.cli:main"

[project.optional-dependencies]
fast = ["rapidfuzz"]
dev = ["pytest", "rapidfuzz"]

[tool.hatch.build.targets.wheel]
packages = ["src/kocer"]
